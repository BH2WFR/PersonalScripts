# ============================================================
# rclone-sync-schema-sample.yaml — agent-facing schema reference
# ============================================================
#
# This file is detailed documentation for agents and users: schema fields,
# inheritance rules, runtime behavior, and illustrative configuration examples.
# Agents should read it when editing rclone-sync.py or a user's actual schema.
# The entry loads the sibling rclone-sync/ package; its README.md describes the
# module boundaries. script_dir still means the entry directory, not that package.
# It is NOT the user's runtime configuration, and is NEVER an automatic default
# or fallback. Do not execute these examples or treat them as the user's sync plan.
# Keep this reference consistent with the script; edit the separately selected
# personal configuration only when the user requests changes to that file.
#
# Select the actual configuration with --schema-file or ZL_RCLONE_SYNC_SCHEMA_FILE
# (--schema-file takes precedence). Interactive startup prompts for a path,
# using that selection as the suggested value; with neither set, input is required.
# With --task, one of those configuration sources is required and used directly.
# Duplicate keys in a YAML mapping are errors, with both definition locations.
# YAML anchors/merge keys may still provide defaults overridden by explicit keys.
#
# Environment variables recognized by the script:
#   ZL_RCLONE_SYNC_SCHEMA_FILE   path to the YAML schema file
#   ZL_RCLONE_CONFIG_PASSWORD    password for an encrypted rclone config
#
# ---- Inheritance rules ------------------------------------------------
# The inheritance chain is:  default → profile(s) → task → sub-task.
# Each layer adds on top of the previous one:
#
#   Field type             Merge behavior
#   ──────────             ──────────────
#   inherit                append+dedup  (resolved recursively — a profile
#                                         may itself inherit other profiles)
#   exclude                append+dedup
#   alternative-remote-host  append+dedup
#   allow-actions          replace (including null, all, or an empty list)
#   sub-tasks              replace
#   paths                  required only under a sub-task; ordered path1/path2 objects
#   everything else        replace (override)
#
# Multiple profiles can be inherited via `inherit: [p1, p2]` — later
# profiles override earlier ones for the same field.  When a profile
# itself declares `inherit`, its parents are resolved first (recursively),
# forming a DAG. Cycles are rejected with the full reference chain, e.g.
# a -> b -> a. All profiles (including default and unused ones) are checked
# when loading the schema. Shared parents in separate branches are valid
# and are applied again in list order; a task/sub-task's own fields win last.
# Unknown profile references and invalid inherit lists are also rejected.
#
# ---- Runtime actions --------------------------------------------------
# Optional preferred-mode controls menu ordering, not which operation must run:
# A nonempty value (including an inherited one) puts matching actions first
# in FLYellow; the other actions use FLCyan. If no layer sets preferred-mode, push/pull
# use FLYellow and the others use FLCyan in the standard order below.
# preferred-mode: null or "" clears an inherited preference and restores that order.
#   sync   -> push, pull first
#   copy   -> push-copy, pull-copy first
#   move   -> push-move, pull-move first (removes source files)
#   bisync -> bisync first
#   check  -> check first
# The other permitted actions remain available. Menus end with Q: exit from
# the task menu, or return from sub-task/host/operation/comparison selection.
# With --task, Q exits when there is no task menu to return to.
# Empty operation/confirmation input retries without selecting or executing.
# Tasks without a sub-task matching this device appear in gray without a number.
# If every task is gray, show the list, warn, and exit without asking for input.
# Empty YAML files, omitted/null tasks, tasks: {}, and empty groups also warn
# and exit. Interactive no-work exit code is 0; an unavailable CLI task returns 1.
# Malformed schemas remain errors, not empty-task warnings.
# Operation paths use FLBlue for local and FLGreen for remote.
# Task labels retain group/task; sub-task menus show that parent label.
# After selection, host/operation/confirmation displays append /sub-task.
# Alternative host menus show group/task/sub-task in FLYellow.
# Ungrouped tasks omit the group prefix.
# Confirmation groups warnings, then shows the command, task/action/comparison,
# and Execute prompt. Move's source-deletion warning appears here, not in the menu.
# CLI --action selects an operation explicitly; --direction/--push/--pull
# instead use the configured sync/copy/move preferred-mode.
# Without a preference, direction-only CLI flags use sync for directories, copy for files.
# allow-actions accepts null, scalar all, or a list of exact action names.
# Omit it to inherit; if never set, all supported actions are available.
# Explicit null/all clears inherited restrictions. [] disables every action, including check.
# Use null (or an empty YAML value) for Python None, not the string "None".
# all must not appear in a list: [all] is invalid. Unknown action names are errors.
# The effective menu is the intersection of allow-actions and path-type support.
# These restrictions also apply to CLI; preferred-mode never grants an action permission.
# Bisync uses rclone's local state directory; Path1 is always local-path.
# Initialize/rebuild with --action bisync --resync, then omit --resync on
# subsequent runs. Changing comparison settings may require rebuilding.
#
# ---- File tasks -------------------------------------------------------
# path-type: directory | file (inherited; default: directory, usually omitted).
# With file, both endpoints contain full filenames, possibly different names.
# Only push-copy-file, pull-copy-file, push-move-file, pull-move-file are offered.
# copy-file uses copyto; move-file uses moveto and removes the source file.
# Exact-file commands cannot be combined with file-selection filters. For file
# tasks only, YAML exclude/ignore-case (including inherited values) and filter
# options in additional-args are ignored, with a warning listing their names
# before the command. This includes include/exclude/filter rules, files-from,
# age/size limits, metadata filters, hash filters, and directory-listing options.
# The single configured file is selected even if an ignored rule would exclude it.
# Directory tasks still apply their filters. Comparison, links/copy-links,
# ignore-case-sync, backend, and other transfer options remain effective.
# preferred-mode accepts copy/move. Without a preference, the two copy-file actions are yellow.
# All four comparisons work; file check/pre-check, sync, and bisync are not provided.
# A file task must not inherit an enabled check-before-sync setting.
# Source must exist as a file; destination may be absent, but cannot be a directory.
# This is checked immediately before execution, dry-run, and re-run.
# Directory contents still use links/copy-links independently of path-type.
# A file endpoint that is itself a symlink is not a separate supported task type:
# a source link requires copy-links; a destination link is refused.
#
# ---- Modification time display ----------------------------------------
# do-not-check-modified-time defaults to false and follows normal inheritance.
# true skips the advisory time queries/display; it does not change comparison
# or disable the mandatory file existence/type checks before transfers.
# Missing destinations show first-upload/download guidance. Missing sources
# show direction-aware warnings. Read failures and empty directories are not
# automatically treated as missing paths or first synchronization.
# Directory timestamps provide hints, not guarantees of individual file age.
# Re-run reuses selected commands without repeating selection, confirmation,
# time display, or pre-sync check; file endpoint guards still apply.
# After failure, retry starts at the failed pair, skipping completed pairs.
# After full success, re-run starts at the first pair. No rollback is performed.
#
# ---- Path variables ---------------------------------------------------
# Every task requires a non-empty sub-tasks list; at least one must match this machine.
# Every sub-task requires paths: [{path1: local, path2: remote}, ...], even for one pair.
# Each object requires path1 and path2, in local/remote order, without a name.
# Endpoint lists such as [local, remote] are rejected; migrate them to objects.
# Objects support the optional per-pair custom-host switches described below.
# An endpoint is a template string, {path: literal}, or {volume: alias, path: relative}.
# Legacy local-path/remote-path keys are rejected at every level. paths is not
# allowed in profiles or parent tasks; endpoints cannot be inherited separately.
# Shared inherit/exclude/path-type and all other options stay on task/sub-task.
# All pairs use one selected action/comparison and one confirmation, in YAML order.
# Commands are printed in full with [1/N], [2/N], ... numbering before execution.
# Failure stops remaining pairs; Ctrl+C cancels the batch. CLI --dry-run prints
# all commands without transferring (volume discovery still runs); interactive d
# simulates the whole batch with fresh volume guards.
# Alternate host selection is shared only among pairs with the same original
# rclone prefix. Different prefixes get separate menus; local/UNC paths are unchanged.
# Existing sub-tasks are alternatives, not implicitly combined into a path batch.
#
# ---- Temporary per-pair addresses -------------------------------------
# Path OBJECTS alone accept these switches (not settings, tasks, or sub-tasks):
#   enable-custom-sftp-host: false       # default false
#   enable-custom-webdav-host: false     # default false
# Only one may be true, and path2 must be a named rclone remote of that backend.
# The switches declare the actual backend; they do not change its type or resolve
# crypt/alias wrappers. Local/volume path2 endpoints cannot enable these prompts.
# Interactive mode first selects any alternative remote, then asks each enabled
# pair whether to use a custom address. Enter defaults to No. Yes asks for:
#   SFTP: a hostname or IPv4/IPv6 address, WITHOUT scheme, port, user, or path.
#         The configured port, username, password, key, and other options remain.
#   WebDAV: a full http(s) base URL, e.g. https://example.com:8443/dav/.
#           Include the intended scheme, port, and service path; no credentials,
#           query, or fragment. Existing authentication and other options remain.
# Blank address keeps the configured value; Q returns without running the batch.
# Values are literal, never expanded as variables or wildcards. Only this pair's
# path2 gets a connection-string override; other pairs and ancillary paths such
# as backup-dir/additional-args are unchanged. No YAML/rclone config is saved.
# Checks, pull/push, dry-runs, and retries use the same selected address.
# CLI --task skips these prompts and retains configured addresses, as it does
# alternative-remote selection. SSH host/certificate checks remain in effect.
#
# Examples:
#   paths:
#     - {path1: '~/Projects', path2: 'dav:Projects', enable-custom-webdav-host: true}
#     - {path1: '/srv/data', path2: 'ssh:backup', enable-custom-sftp-host: true}
#     - {path1: '/srv/data', path2: {volume: backup-usb, path: 'data'}}
#
# ``remote-path-type`` controls how the path2 endpoint is classified:
#   auto    — infer from the path string (default)
#   rclone  — force ``remote-path`` to be treated as a rclone remote
#   local   — force ``remote-path`` to be treated as a local/UNC path
# This affects rclone-remote-only features such as alternative host selection
# and whether remote mtime checks use rclone lsjson or local filesystem APIs.
#
# Every STRING endpoint and path field (backup-dir, log-file)
# supports the following placeholders:
#
#   $VAR / ${VAR} / %VAR%      any environment variable (all platforms)
#   $ENV:VAR / ${ENV:VAR}      PowerShell-style environment variable
#   {{schema_dir}}             directory containing *this* YAML file
#   {{script_dir}}             directory containing rclone-sync.py
#   {{current_dir}}            current working directory (cwd)
#
# Expansion happens once after selecting the task/sub-task. Undefined variables
# and unknown placeholders stop that task with the field name in the error.
# Substituted values stay literal even if they contain $VAR or {{placeholder}}.
# Leading ~ expands to the user home; UNC/rclone and relative paths stay intact.
# Missing variables on other machines' unselected tasks do not block this machine.
#
# Examples:
#   paths: [{path1: '~/Documents', path2: 'myremote:Documents'}]
#   paths: [{path1: '%USERPROFILE%\Documents', path2: 'myremote:Documents'}]
#   paths: [{path1: '$ENV:APPDATA/Code', path2: 'myremote:Code'}]
#   log-file:  "{{schema_dir}}/rclone-sync.log"     (beside the YAML)
#
# ---- Literal endpoints and local volumes ------------------------------
# {path: 'literal/path'} disables variable, placeholder, and leading ~ expansion.
# {volume: backup-usb, path: 'data'} locates a mounted volume and joins a literal
# suffix. Both endpoints accept these objects. Only path and optional volume are
# allowed; unknown keys/aliases are errors. Plain strings retain existing behavior.
# YAML single quotes control YAML escaping, not the runner's template expansion.
# No endpoint does wildcard/glob expansion; use filters for selecting files.
#
# Volume aliases live in top-level local-volumes. label is required and exact;
# filesystem is optional and case-insensitive. Selector values are literal too.
# Discovery runs only for selected tasks containing volume objects. Missing or
# duplicate volumes, multiple mount roots, incomplete scans, and unmounted volumes
# stop the task. No automatic mounting or fallback directory creation is performed.
# Suffixes use /, reject absolute/drive/UNC paths and .., and use '.' for the root.
# Endpoint symlinks that escape the root and paths entering another filesystem
# are rejected. Recursive link handling inside a source remains governed by rclone
# links/copy-links options. Volume endpoints always use local metadata/host handling.
# Before pre-checks, transfers, retries, simulated dry-runs, and link repair, the
# selected volume identity and mount are checked again. Read-only volumes are
# allowed as copy sources and for check, but not for destinations/move/bisync.
# Changed identities or mounts require selecting the task again; cached commands
# never silently rebind to a different location. Guards cannot prevent hot-unplug
# during a running rclone process. Bisync state uses resolved paths, so stable
# mounts are recommended; changing a path may require explicit state rebuilding.
# Native tools: Windows pwsh 7 Storage/CIM, Linux lsblk, macOS diskutil.
# No additional Python dependency is needed.
#
# Examples:
#   paths: [{path1: '/srv/data', path2: {volume: backup-usb, path: 'server-data'}}]
#   paths: [{path1: {path: '/srv/$literal/%NAME%/{{text}}'}, path2: {volume: backup-usb, path: '$literal'}}]
# ============================================================


# -------------------------------------------------------------------
# settings  —  reusable named profiles (optional section)
# -------------------------------------------------------------------
settings:
  # "default" is special: every task inherits these values automatically.
  default:
    # preferred-mode: sync   # optional: sync | copy | move | check | bisync
    do-not-check-modified-time: false  # true skips the advisory time comparison
    progress: true          # show real-time transfer progress     [default: true]
    transfer: 8             # parallel file transfers (1-64)       [default: 4]
    exclude:                # glob patterns to skip                [default: []]
      - ".git/**"
      - ".DS_Store"
      - "Desktop.ini"
      - "Thumbs.db"
      - "*.bak"

  # ---- bulk ---------------------------------------------------------
  # For large transfers: bumps parallelism, enables logging.
  bulk:
    transfer: 24
    log-file: "{{schema_dir}}/rclone-sync.log"
    log-level: INFO         # ERROR | NOTICE | INFO | DEBUG        [default: "" = rclone default]

  # ---- cautious -----------------------------------------------------
  # Safety net: limits deletions, runs a pre-sync check.
  cautious:
    max-delete-count: 50
    max-delete-percent: 50
    check-before-sync: true
    stop-on-check-failure: false

  # ---- host-webdav ---------------------------------------------------
  # Provides alternative WebDAV host names for accessing the same NAS
  # via different network paths.  At runtime the user is prompted to
  # pick one (or keep the default from their sub-task's remote-path).
  #
  # `alternative-remote-host` is inherited by *append+dedup* — a sub-task
  # that adds its own list will extend the inherited one, not discard it.
  # It only applies when remote-path is classified as a rclone remote
  # such as "dav-ddns4:". Local filesystem paths, Windows drive paths,
  # Unix absolute paths, and UNC paths ignore this setting.
  #
  # Example — if a sub-task has remote-path: "dav-ddns4:/backup/data",
  # the user will see these full paths at runtime:
  #   [0] dav-ddns4:/backup/data     (current)
  #   [1] dav-ddns6:/backup/data     DDNS IPv6 (direct)
  #   [2] dav-lan:/backup/data       local network (same subnet)
  #   [3] dav-tailscale:/backup/data Tailscale mesh VPN
  host-webdav:
    alternative-remote-host:
      - "dav-ddns4"         # DDNS IPv4 (e.g. port forward / FRP)
      - "dav-ddns6"         # DDNS IPv6 (direct)
      - "dav-lan"           # local network (same subnet)
      - "dav-tailscale"     # Tailscale mesh VPN

  # ---- profile-inherits-profile example --------------------------------
  # Profiles can inherit other profiles recursively.  The chain is
  # resolved depth-first: parents first, then the inheriting profile on
  # top.  ``inherit`` itself is append+dedup, so a profile that inherits
  # another will also pass through its inherited parent's profiles.
  #
  # full-bulk:
  #   inherit: [bulk]
  #   notify-after-sync: true
  #   bwlimit: "5M"


# -------------------------------------------------------------------
# local-volumes — illustrative literal selectors, not a runtime default
# -------------------------------------------------------------------
local-volumes:
  backup-usb:
    label: BACKUP
    filesystem: exfat

# -------------------------------------------------------------------
# tasks  —  sync task definitions (omit/null/empty means no tasks)
# -------------------------------------------------------------------
tasks:
  # ---------- ungrouped tasks ----------
  ungrouped:
    - name: local-volume-backup
      preferred-mode: copy
      sub-tasks:
        - name: linux
          platform: linux
          paths:
            - {path1: '/srv/example-data', path2: {volume: backup-usb, path: 'server-data'}}

    # =================================================================
    # "perfect-task" — demonstrates every available field
    # =================================================================
    - name: perfect-task

      # ---- inherit --------------------------------------------------
      # Pull defaults from a named profile in `settings`.
      inherit: [cautious]            # [default: "" = no profile]

      # ---- preferred-mode -------------------------------------------
      # Matching actions are placed first; the menu still offers other modes.
      # Omit to inherit preferred-mode; null or "" clears an inherited preference.
      # sync   — make dest match source, one-way (deletes extra files)
      # copy   — copy source to dest, preserves extra destination files
      # move   — like copy but deletes source files after transfer
      # check  — compare source vs dest (read-only, no transfer)
      # bisync — bidirectional sync with persistent state and explicit initialization
      preferred-mode: sync           # optional [default: no menu preference]

      # ---- progress -------------------------------------------------
      progress: true                 # show live progress with -P     [default: true]

      # ---- transfer -------------------------------------------------
      transfer: 16                   # parallel transfers, 1-64       [default: 4]

      # ---- links / copy-links ---------------------------------------
      # links      — preserve symlinks as symlinks (--links / -l).
      # copy-links — follow symlinks and copy target files (--copy-links / -L).
      # `follow-link` is kept as a deprecated alias for `copy-links`.
      links: false                   # [default: false]
      copy-links: true               # [default: false]

      # ---- case sensitivity -------------------------------------------
      # ignore-case      — make filter/exclude patterns case-insensitive
      #                     (--ignore-case).  E.g. --exclude "*.jpg" also
      #                     matches .JPG, .Jpg, etc.
      # ignore-case-sync — treat files differing only in case as the same
      #                     (--ignore-case-sync).  Important for cross-
      #                     platform sync: Windows/macOS vs Linux.
      ignore-case: false             # [default: false]
      ignore-case-sync: false        # [default: false]

      # ---- comparison strategy ------------------------------------------
      # Sync/copy/move offer size_and_time, size_only, force, checksum.
      # Bisync excludes force and maps the choice to --compare.
      # Check offers size_only/checksum, defaulting to checksum.
      # ignore-times — transfer every source file unconditionally
      #                (--ignore-times).  In interactive mode this only
      #                makes "force" the default comparison selection.
      # checksum  — compare by size and checksum (MD5/SHA1), not modtime
      #             (--checksum).  Slower but detects bit-level changes
      #             that don't update modtime.  In interactive mode this
      #             only makes "checksum" the default selection.
      # size-only — compare by file size only, skip checksum AND modtime
      #             (--size-only).  Fastest but least accurate.  In
      #             interactive mode this only makes "size_only" the
      #             default comparison selection.
      # update    — skip files that are newer on the destination
      #             (--update).  Useful for one-way backups.
      ignore-times: false            # [default: false]
      checksum: false                # [default: false]
      size-only: false               # [default: false]
      update: false                  # [default: false]

      # ---- transfer behaviour -------------------------------------------
      # bwlimit       — bandwidth limit, e.g. "2M", "1.5M", "off"
      #                 (--bwlimit).  Empty = unlimited.
      # ignore-errors — continue even if I/O errors occur on some files
      #                 (--ignore-errors).  Useful for bulk transfers.
      # retries       — number of retries on failure (--retries, 3=default)
      bwlimit: ""                    # [default: "" = unlimited]
      ignore-errors: false           # [default: false]
      retries: 3                     # [default: 3]

      # ---- S3 backend -----------------------------------------------
      # Skip S3 bucket existence/create checks before object operations
      # (--s3-no-check-bucket).  Useful when the bucket already exists
      # and credentials can read/write objects but cannot CreateBucket.
      s3-no-check-bucket: false      # [default: false]

      # ---- action safety --------------------------------------------
      # Disable individual actions to prevent accidental reversal or deletion.
      # push means sync upload only; it does not grant push-copy or push-move.
      # Lists replace inherited lists. [] disables all actions; omit to inherit.
      # If never set, all supported actions are available. Explicit all resets restrictions.
      # Bisync and check are independently controlled, like every other action.
      # allow-actions: all           # usually omitted

      # ---- path type ------------------------------------------------
      path-type: directory           # directory | file [default: directory]

      # ---- remote path type -----------------------------------------
      # auto   — infer rclone vs local/UNC from remote-path
      # rclone — force remote-path to be treated as a rclone remote
      # local  — force remote-path to be treated as local/UNC
      # This mainly controls rclone-remote-only features such as
      # alternative-remote-host and remote mtime checks.
      remote-path-type: auto         # auto | rclone | local  [default: auto]

      # ---- exclude --------------------------------------------------
      # Appends to inherited excludes (here: default + cautious).
      # Applies to directory tasks; exact-file tasks ignore it with a warning.
      # Effective excludes for this task:
      #   .git/**  .DS_Store  Desktop.ini  Thumbs.db  *.bak  *.tmp  node_modules/**  .venv/**
      exclude:                       # [default: []]
        - "*.tmp"
        - "node_modules/**"
        - ".venv/**"

      # ---- delete-excluded ------------------------------------------
      # Also delete excluded files from destination (--delete-excluded).
      delete-excluded: true          # [default: false]

      # ---- backup-dir -----------------------------------------------
      # Deleted / overwritten files are moved here instead of
      # being permanently lost (--backup-dir).  Supports path variables.
      # Must be on the same backend as the destination.  Pull is
      # refused when a generic backup-dir is configured.
      # Bisync requires explicit --backup-dir1/--backup-dir2 instead.
      backup-dir: "myremote:Projects/_deleted_backup"  # [default: "" = off]

      # ---- deletion limits ------------------------------------------
      # Sync: abort if more than this many files would be deleted; -1 = unlimited.
      max-delete-count: 100          # optional [rclone default: unlimited]
      # Bisync: abort if deletions exceed this percentage on either side (0..100).
      max-delete-percent: 50         # optional [rclone default: 50 percent]
      # Each limit applies only to its own mode; copy/move/check use neither.

      # ---- check-before-sync ----------------------------------------
      # Separate from do-not-check-modified-time, which only hides time checks.
      # Run `rclone check` before the real sync to preview differences.
      # Applies to directory sync/copy/move only; copy/move checks use --one-way.
      #   true       — full comparison (checksum + size)
      #   size-only  — compare only file sizes (faster)
      #   false      — skip pre-sync check
      check-before-sync: size-only   # [default: false]
      stop-on-check-failure: false   # true = stop check fails

      # ---- notify-after-sync ----------------------------------------
      # Fire a desktop notification when the sync completes.
      notify-after-sync: true        # [default: false]

      # ---- log-file -------------------------------------------------
      # Write rclone output to this file (--log-file).
      log-file: "{{schema_dir}}/logs/sync.log"  # [default: ""]

      # ---- log-level ------------------------------------------------
      # rclone log verbosity.  Empty = rclone default (NOTICE).
      log-level: DEBUG               # ERROR | NOTICE | INFO | DEBUG  [default: ""]

      # ---- additional-args ------------------------------------------
      # Extra flags passed directly to rclone.
      additional-args:               # [default: []]
        - "--create-empty-src-dirs"

      # ---- sub-tasks ------------------------------------------------
      # Per-machine overrides.  Only sub-tasks matching the current
      # machine (platform / arch / hostname / Linux GUI) are offered at runtime.
      #
      # ``platform``, ``arch``, and ``computer-name`` each accept:
      #   str       — exact match (case-insensitive)
      #   list[str] — OR semantics (satisfy any one)
      #   empty / omitted — match any machine
      #
      # ``linux-gui-required`` accepts true / false only (not null, strings or lists):
      #   true  — on Linux, require an X11 or Wayland session
      #   false — no GUI requirement; runs with or without a display (default)
      #   omitted inherits; explicit false clears an inherited GUI requirement
      # Ignored on Windows/macOS; add platform: linux for Linux-only tasks.
      # May appear in settings profiles, tasks, or sub-tasks.
      # Uses System.get_linux_gui(): DISPLAY / WAYLAND_DISPLAY, not whether
      # desktop packages are installed. SSH without display variables is headless.
      #
      # ``alternative-remote-host`` can appear at the sub-task level
      # too, providing machine-specific alternative hosts. It is ignored
      # unless remote-path is classified as a rclone remote.
      sub-tasks:
        # --- Match by hostname ---
        - name: desktop-pc
          computer-name: ZL-DESKTOP
          paths:
            - {path1: 'D:\Projects', path2: 'myremote:/Projects'}
          # At runtime the user can choose:
          #   [0] myremote:/Projects        (current)
          #   [1] myremote-backup:/Projects
          alternative-remote-host:
            - "myremote"
            - "myremote-backup"

        # --- Match by platform + arch (str) ---
        - name: laptop-x64
          platform: windows
          arch: amd64
          paths:
            - {path1: '$ENV:HOME\Projects', path2: 'myremote:/Projects'}

        # --- Match by platform only ---
        - name: macbook
          platform: darwin
          paths:
            - {path1: '~/Projects', path2: 'myremote:/Projects'}

        # --- Match by platform OR (list, any satisfy) ---
        - name: linux-or-macos
          platform: [linux, darwin]
          paths:
            - {path1: '~/Projects', path2: 'myremote:/Projects'}

        # --- Linux session requiring a GUI ---
        - name: linux-desktop
          platform: linux
          linux-gui-required: true
          paths:
            - {path1: '~/Projects', path2: 'myremote:/Projects'}

    # =================================================================
    # "minimal" — simplest tasks
    # =================================================================
    # Each sub-task declares both endpoints, while common options remain on
    # the parent task. Different machines remain separate menu alternatives.
    - name: minimal
      sub-tasks:
        - name: macos
          platform: darwin
          paths:
            - {path1: '~/Documents', path2: 'myremote:Documents'}
        - name: windows
          platform: windows
          paths:
            - {path1: '%USERPROFILE%\Documents', path2: 'myremote:Documents'}

    # If there's only one sub-task, paths can stay at sub-task level.
    - name: minimal-single
      sub-tasks:
        - name: default
          paths:
            - {path1: '~/Documents', path2: 'myremote:Documents'}

    # Multiple pairs execute sequentially, with no additional selection menu.
    - name: multiple-directories
      sub-tasks:
        - name: default
          paths:
            - {path1: '~/Example/config', path2: 'myremote:Example/config'}
            - {path1: '~/Example/data', path2: 'myremote:Example/data'}

    # These named remotes must already exist with the matching backend type.
    - name: temporary-addresses
      preferred-mode: copy
      sub-tasks:
        - name: default
          paths:
            - path1: '~/Projects'
              path2: 'dav:Projects'
              enable-custom-webdav-host: true
            - path1: '~/Documents'
              path2: 'ssh:backup/Documents'
              enable-custom-sftp-host: true

    # One file, two exact filenames; no upload/download sub-task split.
    # Omit allow-actions to also permit the two move-file actions.
    # Inherited default excludes are ignored for this exact-file task.
    - name: single-config-file
      path-type: file
      allow-actions: [push-copy-file, pull-copy-file]
      preferred-mode: copy
      sub-tasks:
        - name: windows
          platform: windows
          paths:
            - {path1: '$ENV:APPDATA/ExampleApp/config.ini', path2: 'myremote:AppData/ExampleApp/config.ini'}


  # ---------- grouped tasks ----------
  # Tasks can be organized into named groups for clarity.
  # Groups and their tasks are listed in schema order, including ungrouped.
  media:
    # =================================================================
    # "photos-sync" — example using inherit with host-webdav
    # =================================================================
    #
    # Inherits:
    #   bulk        → transfer=24, log-file, log-level=INFO
    #   host-webdav → alternative-remote-host (4 WebDAV paths)
    #   default     → no mode preference, progress=true, exclude patterns, …
    #
    # At runtime the user will be asked to choose a dav-* host before
    # the sync runs.  Excludes from default are still active.
    - name: photos-sync
      preferred-mode: sync
      check-before-sync: true
      inherit: [bulk, host-webdav]
      sub-tasks:
        - name: default
          paths:
            - {path1: '~/Pictures', path2: 'myremote:Photos'}
          # At runtime the user can choose:
          #   [0] dav-ddns4:/Photos     (current)
          #   [1] dav-ddns6:/Photos     DDNS IPv6 (direct)
          #   [2] dav-lan:/Photos       local network (same subnet)
          #   [3] dav-tailscale:/Photos Tailscale mesh


    # =================================================================
    # "music-backup" — simple copy task, no host switching
    # =================================================================
    - name: music-backup
      preferred-mode: copy        # prefer copy; permissions below exclude sync/move
      allow-actions: [push-copy, pull-copy, check]  # preserve extra destination files
      sub-tasks:
        - name: default
          paths:
            - {path1: '~/Music', path2: 'myremote:Music'}
