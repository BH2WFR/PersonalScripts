launcher:
    script-root: "tools"
    test:
        enabled: false
        test-root: "test"

    additional-path-env: "ZL_SCRIPT_ADDITIONAL_PATH"
    requirements-file: "requirements.txt"
    excluded-paths:
        - "run-script.py"
        - "run-script.sh"
        - "run-script.ps1"
        - "compile-script.py"
    script-types:
        python:
            extension: ".py"
            color: "CRst"
        bash:
            extension: ".sh"
            color: "CRst"
        powershell:
            extension: ".ps1"
            color: "CRst"

display:
    default-folder-color: "FLCyan"
    test-header-color: "FLCyan"
    additional-header-color: "FLCyan"

script-name-highlight-pattern:
    FLYellow:
        - "\\bgit\\b"
        - "\\brclone\\b"
        - "\\bpdf\\b"
        - "\\bffmpeg\\b"
        - "\\btailscale\\b"
        - "\\bopenssl\\b"
    FLGreen:
        - "\\.sh$"
    FLCyan:
        - "\\.ps1$"

folder-name-highlight-pattern:
    FLGreen:
        - "^windows/"
        - "^macos/"
        - "^linux/"


ignore-list:
    all-platforms:
        - "tmp/"
        - "output/"
        - "__pycache__/"
        - ".git/"
        - ".venv/"
        - "node_modules/"
        - ".idea/"
        - "dist/"
        - "BUILD/"
        - "INSTALL/"
    platform-specific:
        windows:
            - "macos/"
            - "linux/"
            - "filesystem/batch-add-chmod-x.sh"
        linux:
            - "windows/"
            - "macos/"
            - "filesystem/link-fix-to-symlinkd-windows.py"
            - "filesystem/git-batch-add-chmod-x.ps1"
            - "keyboard-hook-viewer.py" # only for windows / macos (linux x11 is reserved, linux Wayland is not supported)
        macos:
            - "windows/"
            - "linux/"
            - "filesystem/link-fix-to-symlinkd-windows.py"
            - "filesystem/git-batch-add-chmod-x.ps1"
    arch-specific:
        # 规范：x86, x86_64, armv7, arm64
        x86_64:
            macos:
                - "macos/screen-utils.py"
    no-gui:
        linux:
            - "" # 暂时留空

extra-env-paths:
    all-platforms:
        - "./deps/python"
        - "./deps/bin"
        - "./deps/ffmpeg"
        - "./deps/ghostscript/bin"
    windows:
        - "./deps/gsudo"
