launcher:
    script-root: "tools"
    test:
        enabled: false
        test-root: "test"

    requirements-file: "requirements.txt"
    excluded-paths:
        - "run-script.py"
        - "run-script.sh"
        - "run-script.ps1"
        - "compile-script.py"
    script-types:
        python:
            extension: ".py"
            color: "CRst"
        bash:
            extension: ".sh"
            color: "CRst"
        powershell:
            extension: ".ps1"
            color: "CRst"

display:
    default-folder-color: "FLCyan"
    test-header-color: "FLCyan"
    additional-header-color: "FLCyan"

script-name-highlight-pattern:
    FLYellow:
        - "\\bgit\\b"
        - "\\brclone\\b"
        - "\\bpdf\\b"
        - "\\bffmpeg\\b"
        - "\\btailscale\\b"
        - "\\bopenssl\\b"
        - "\\brime\\b"
    FLGreen:
        - "\\.sh$"
    FLCyan:
        - "\\.ps1$"

folder-name-highlight-pattern:
    FGray:
        - "^others/"
    FLGreen:
        - "^windows/"
        - "^macos/"
        - "^linux/"


ignore-list:
    all-platforms:
        - "tmp/"
        - "output/"
        - "__pycache__/"
        - ".git/"
        - ".venv/"
        - "node_modules/"
        - ".idea/"
        - "dist/"
        - "BUILD/"
        - "INSTALL/"
        - "research/matrix-viewer/"
        - "network/rclone-sync/"
        - "others/keyboard-hook-viewer/"
        - "others/system-event-viewer/"
        - "windows/keyboard-remapper/"
        - "document-processing/pdf-tools/"
    platform-specific:
        # 规范：windows, linux, macos
        windows:
            - "macos/"
            - "linux/"
            - "filesystem/executable-bit-setter.sh"
        linux:
            - "windows/"
            - "macos/"
            - "filesystem/git-executable-bit-setter.ps1"
        macos:
            - "windows/"
            - "linux/"
            - "filesystem/git-executable-bit-setter.ps1"
    arch-specific:
        # 规范：x86, x86_64, armv7, arm64
        x86_64:
            macos:
                - "macos/display-manager.py"
    linux-gui-specific:
        # 规范：no-gui, wayland, x11
        no-gui: # 仅列出无 GUI，但是在无桌面环境时可能不适用的工具
            - "others/keyboard-hook-viewer.py"
            - "document-processing/document-screenshot.py"
            # 也包含所有 gui-tools-list 中的软件
        wayland:
            - "others/keyboard-hook-viewer.py"
            - "document-processing/document-screenshot.py"
        x11:
            # 暂无

gui-tools-list: # 下列程序在列出时会带上 `[GUI]` 的尾巴；linux-no-gui 下也会被隐藏
    - "others/system-event-viewer.py"
    - "document-processing/document-screenshot.py"
    - "document-processing/pdf-binarizer.py"
    - "document-processing/pdf-bookmark-editor.py"
    - "document-processing/pdf-font-replacer.py"
    - "document-processing/pdf-page-splitter.py"
    - "research/matrix-viewer.py"
    - "others/script-to-app.py"
    - "others/unicode-inspector.py"

extra-env-paths:
    # 规范：all-platforms, windows, linux, macos
    all-platforms:
        - "./deps/python"
        - "./deps/bin"
        - "./deps/ffmpeg"
        - "./deps/ghostscript/bin"
    windows:
        - "./deps/gsudo"
