launcher:
    script-root: "tools"
    test:
        enabled: false
        test-root: "test"

    requirements-file: "requirements.txt"
    excluded-paths:
        - "run-script.py"
        - "run-script.sh"
        - "run-script.ps1"
        - "compile-script.py"
    script-types:
        python:
            extension: ".py"
            color: "CRst"
        bash:
            extension: ".sh"
            color: "CRst"
        powershell:
            extension: ".ps1"
            color: "CRst"

display:
    default-folder-color: "FLCyan"
    test-header-color: "FLCyan"
    additional-header-color: "FLCyan"

script-name-highlight-pattern:
    FLYellow:
        - "\\bgit\\b"
        - "\\brclone\\b"
        - "\\bpdf\\b"
        - "\\bffmpeg\\b"
        - "\\btailscale\\b"
        - "\\bopenssl\\b"
        - "\\brime\\b"
        - "\\byt-dlp\\b"
        - "\\bbbdown\\b"
    FLGreen:
        - "\\.sh$"
    FLCyan:
        - "\\.ps1$"

folder-name-highlight-pattern:
    FGray:
        - "^others/"
    FLGreen:
        - "^windows/"
        - "^macos/"
        - "^linux/"


ignore-list:
    all-platforms:
        - "tmp/"
        - "output/"
        - "__pycache__/"
        - ".git/"
        - ".venv/"
        - "node_modules/"
        - ".idea/"
        - "dist/"
        - "BUILD/"
        - "INSTALL/"
        - "research/matrix-viewer/"
        - "network/rclone-sync/"
        - "input-and-text/text_processor/"
        - "input-and-text/unicode_inspector/"
        - "input-and-text/auto_typer/"
        - "input-and-text/screen_keyboard/"
        - "input-and-text/keyboard-hook-viewer/"
        - "others/system-event-viewer/"
        - "others/screen_mask/"
        - "others/window_inspector/"
        - "windows/keyboard-remapper/"
        - "windows/locale_launcher/"
        - "document-processing/pdf-tools/"
    platform-specific:
        # 规范：windows, linux, macos
        windows:
            - "macos/"
            - "linux/"
            - "filesystem/executable-bit-setter.sh"
        linux:
            - "windows/"
            - "macos/"
            - "input-and-text/auto-typer.py"
            - "others/window-inspector.py"
            - "input-and-text/screen-keyboard.py"
            - "filesystem/git-executable-bit-setter.ps1"
        macos:
            - "windows/"
            - "linux/"
            - "filesystem/git-executable-bit-setter.ps1"
    arch-specific:
        # 规范：x86, x86_64, armv7, arm64
        x86_64:
            macos:
                - "macos/display-manager.py"
    linux-gui-specific:
        # 规范：no-gui, wayland, x11
        no-gui: # 仅列出无 GUI，但是在无桌面环境时可能不适用的工具
            - &keyboard_hook_viewer "input-and-text/keyboard-hook-viewer.py"
            - "document-processing/document-screenshot.py"
            # 也包含所有 gui-tools-list 中的软件
        wayland:
            - *keyboard_hook_viewer
            - "document-processing/document-screenshot.py"
        x11:
            # 暂无

gui-tools-list: # 下列程序在列出时会带上 `[GUI]` 的尾巴；linux-no-gui 下也会被隐藏
    # 禁止有多余的注释
    - "windows/keyboard-remapper.py"
    - "windows/locale-launcher.py"
    - "input-and-text/auto-typer.py"
    - "input-and-text/screen-keyboard.py"
    - "others/screen-mask.py"
    - "others/system-event-viewer.py"
    - "others/window-inspector.py"
    - "document-processing/document-screenshot.py"
    - "document-processing/image-to-text-and-formula.py"
    - "document-processing/pdf-binarizer.py"
    - "document-processing/pdf-bookmark-editor.py"
    - "document-processing/pdf-font-replacer.py"
    - "document-processing/pdf-metadata-editor.py"
    - "document-processing/pdf-ocr.py"
    - "document-processing/pdf-page-splitter.py"
    - "research/matrix-viewer.py"
    - "others/script-to-app.py"
    - "input-and-text/text-path-processor.py"
    - "input-and-text/unicode-inspector.py"

elevation-needed-list: # 下列程序，启动时需要提权，启动器中列出时会带上 `[SUDO]` 的尾巴
    all-platforms:
        - "filesystem/executable-bit-setter.sh"
        - "filesystem/link-creator.py"
        - "filesystem/path-in-use.py"
        - "others/disk-smart-info-viewer.py"
        - "others/script-to-app.py"
    windows:
        - "windows/keyboard-remapper.py"
        - "windows/android-rndis-record-cleaner.py"
        - "windows/device-ejection-history.py"
        - "windows/event-log-cleaner.py"
        - "windows/file-association-manager.py"
        - "windows/firewall-app-blocker.py"
        - "windows/network-repair.py"
        - "windows/privacy-cleaner.py"
        - "windows/recycle-bin-cleaner.py"
        - "windows/service-restarter.py"
        - "input-and-text/auto-typer.py"
        - "input-and-text/screen-keyboard.py"
        - "others/window-inspector.py"
    macos:
        - "macos/ntfs-3g-mount-manager.py"
        - "macos/privacy-cleaner.py"

extra-env-paths:
    # 规范：all-platforms, windows, linux, macos
    all-platforms:
        - "./deps/python"
        - "./deps/bin"
        - "./deps/ffmpeg"
        - "./deps/ghostscript/bin"
    windows:
        - "./deps/gsudo"
